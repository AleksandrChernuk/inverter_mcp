name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dxf-tools:
    name: dxf_tools (python selftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned deps
        run: pip install -r dxf_tools/requirements.txt
      - name: Selftest
        run: python dxf_tools/selftest.py

  phase2-node:
    name: phase2 connector + gateway tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pnpm
        # Install the pinned pnpm directly (NOT via corepack): the runner's bundled
        # corepack now ships pnpm 12.x, which refuses to switch to the packageManager-
        # pinned 8.10.0 under corepack (ERR_PNPM_BAD_PM_VERSION). A direct global install
        # matches the packageManager field and honours --frozen-lockfile.
        run: npm install -g pnpm@8.10.0
      - name: Install connector dependencies
        run: pnpm --dir phase2/connectors-inventor install --frozen-lockfile
      - name: Test connector
        run: pnpm --dir phase2/connectors-inventor test
      - name: Install gateway dependencies
        run: pnpm --dir phase2/gateway install --frozen-lockfile
      - name: Test gateway
        run: pnpm --dir phase2/gateway test
      - name: Gateway syntax check
        run: pnpm --dir phase2/gateway check
