name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dxf-tools:
    name: dxf_tools (python selftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned deps
        run: pip install -r dxf_tools/requirements.txt
      - name: Selftest
        run: python dxf_tools/selftest.py

  gateway-syntax:
    name: phase2 gateway (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: node --check phase2/gateway/src/server.mjs
